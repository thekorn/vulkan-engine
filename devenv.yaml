# Preserve the toolchain inputs used by the package flake.
inputs:
  nixpkgs:
    url: github:NixOS/nixpkgs/nixos-unstable
  zig-overlay:
    url: github:mitchellh/zig-overlay
    inputs:
      nixpkgs:
        follows: nixpkgs
  zcov-src:
    url: github:ericsssan/zcov
    flake: false
  zls:
    url: github:zigtools/zls
    inputs:
      nixpkgs:
        follows: nixpkgs
